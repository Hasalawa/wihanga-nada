name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Dev requirements only: the tests use a fake identifier, so there is
      # no need to download TensorFlow or the BirdNET model in CI.
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Front-end syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript parses
        run: node --check wihanga/static/app.js

      - name: Check manifest and bird data are valid JSON
        run: |
          python3 -c "import json; json.load(open('wihanga/static/manifest.json'))"
          python3 -c "import json; json.load(open('wihanga/endemics.json', encoding='utf-8'))"
