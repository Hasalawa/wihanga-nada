    <text x="60" y="244" font-size="62" font-weight="700" letter-spacing="1">Nada</text>
    <rect x="62" y="262" width="96" height="5" rx="2.5" fill="#f0b84a"/>
    <text x="62" y="300" font-size="22" fill="#cfe3cf">Offline bird-call identifier for Sri Lanka</text>
    <text x="62" y="334" font-size="17" fill="#9fc3a6">Open-weight AI. No signal. Look up.</text>
