<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1912">
  <title>Wihanga Nada</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Wihanga Nada</h1>
      <p class="tag">Listen to the forest. Look up.</p>
      <div class="chips">
        <span id="chip-model" class="chip">model: …</span>
        <span id="chip-llm" class="chip">notes: …</span>
      </div>
    </header>

    <section class="stage">
      <button id="listen" class="orb" type="button" aria-pressed="false">Listen</button>
      <p id="status" role="status" aria-live="polite">Tap once, then put the phone away and look up. Names are spoken aloud.</p>
    </section>

    <section class="opts" aria-label="Options">
      <label><input type="checkbox" id="opt-speak" checked> Speak bird names</label>
      <label><input type="checkbox" id="opt-notes"> Field notes from the local LLM</label>
      <label><input type="checkbox" id="opt-si"> Notes in Sinhala (experimental)</label>
      <label><input type="checkbox" id="opt-dim"> Pocket mode (dim the screen)</label>
    </section>

    <section>
      <h2>Heard just now</h2>
      <ul id="heard" class="cards"></ul>
    </section>

    <details id="log">
      <summary>Trip log</summary>
      <div id="log-body"></div>
      <a href="/api/sightings.csv" download>Download CSV</a>
    </details>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
